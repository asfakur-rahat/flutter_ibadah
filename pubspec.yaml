name: flutter_ibadah
description: "A customizable Flutter widget showing Islamic prayer times for any city worldwide."
version: 0.3.1

environment:
  sdk: ^3.5.0
  flutter: ">=3.20.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  flutter_svg: ^2.2.1
  flutter_bloc: '>=8.1.6 <10.0.0'
  equatable: '>=2.0.7 <4.0.0'
  hive_flutter: ^1.1.0
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your package, add an assets section, like this:
  assets:
    - assets/icons/

  # To add custom fonts to your package, add a fonts section here,
  # in this format:
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Black.ttf
          weight: 900
        - asset: assets/fonts/satoshi/Satoshi-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/satoshi/Satoshi-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Light.ttf
          weight: 300
        - asset: assets/fonts/satoshi/Satoshi-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/satoshi/Satoshi-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Regular.ttf
          weight: 400

screenshots:
  - description: 'Prayer times and the next-prayer countdown for Dhaka, Bangladesh.'
    path: doc/screenshots/01_dhaka.png
  - description: 'Any city worldwide — Toronto, rendered in Toronto time even when the device is not.'
    path: doc/screenshots/02_toronto.png
  - description: 'Dark theme, showing Mecca with the Umm al-Qura calculation method.'
    path: doc/screenshots/03_mecca_dark.png
  - description: 'Localized strings and digits — Cairo in Arabic with Arabic-Indic numerals.'
    path: doc/screenshots/04_cairo_arabic.png
  - description: 'Theming with IbadahTheme.fromSeed(), showing Istanbul.'
    path: doc/screenshots/05_istanbul_seeded.png

homepage: https://github.com/asfakur-rahat/flutter_ibadah
repository: https://github.com/asfakur-rahat/flutter_ibadah
license: MIT
